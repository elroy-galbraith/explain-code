name: genai-eval toolkit tests

# Runs the evalstats test suites. What these guard that isn't obvious:
#
#   1. Every statistic here is pinned by a known-answer test with the arithmetic
#      shown in the test docstring. A refactor that silently changes a chance
#      correction or a variance divisor produces a plausible number, not an
#      error, and only the pinned values catch it.
#   2. The degenerate-input cases (one human rater, zero variance, single
#      category) must raise or return None rather than return a number. A
#      confident-looking statistic computed from nothing is the failure mode
#      this plugin exists to prevent.
#
# Pure Python 3 standard library — no install step needed.

on:
  push:
    branches: [main]
    paths:
      - "genai-eval/**"
      - ".github/workflows/genai-eval-tests.yml"
  pull_request:
    paths:
      - "genai-eval/**"
      - ".github/workflows/genai-eval-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the evalstats test suites
        run: |
          python3 -m unittest discover -s genai-eval/scripts/tests -p "test_*.py" -v

      - name: Verify the CLI runs clean on the worked example
        run: |
          set -euo pipefail
          python3 genai-eval/scripts/calibrate.py \
            genai-eval/examples/judge-calibration/labels.csv \
            --level ordinal --judge-model model-a --mid 0.10 --seed 7 \
            > worked-example.md
          # Exit 0 alone would pass on an empty report, so check that each
          # section the example is documented to produce actually appears.
          grep -q "Judge-human agreement" worked-example.md
          grep -q "Human-human agreement" worked-example.md
          grep -q "Length: judge rho" worked-example.md
          grep -q "Disagreement clusters" worked-example.md

      - name: Verify the single-rater path still discloses the missing ceiling
        run: |
          set -euo pipefail
          # The behaviour this whole phase exists to deliver: with one human
          # rater column there is no ceiling, and the report has to say Gate 6
          # is unanswered rather than letting the judge's figure read as if it
          # had cleared a bar. Nothing else in CI exercises that path.
          printf 'item_id,human,judge\ni1,1,1\ni2,1,2\ni3,2,2\ni4,2,1\ni5,1,1\ni6,2,2\n' \
            > one-rater.csv
          python3 genai-eval/scripts/calibrate.py one-rater.csv --seed 7 \
            > one-rater.md
          grep -q "Gate 6" one-rater.md
          grep -q "no human-human ceiling" one-rater.md

      - name: Verify the worked card passes every checkable gate
        run: |
          set -euo pipefail
          python3 genai-eval/scripts/check_eval_card.py \
            genai-eval/examples/rag-grounding/eval-card.json > card-check.txt
          cat card-check.txt
          # Exit 0 alone would pass if a future refactor returned early
          # before running a gate, so pin the tool's own summary line to the
          # exact counts this card is documented to produce: this example
          # carries one deliberate Gate 2 warning (a ranked harm pathway
          # nothing in the card measures -- see
          # examples/rag-grounding/README.md), not a clean report with none.
          # Zero errors and that one named warning is what "every checkable
          # gate passes" looks like for this card.
          grep -q "0 error(s), 1 warning(s)" card-check.txt
          grep -q "WARNING \[Gate 2\]" card-check.txt

      - name: Verify a tampered test split fails Gate 5
        run: |
          set -euo pipefail
          cp genai-eval/examples/rag-grounding/items/test.jsonl /tmp/test.jsonl.bak
          echo '{"item_id": "tamper", "claim_id": "cl1"}' \
            >> genai-eval/examples/rag-grounding/items/test.jsonl
          if python3 genai-eval/scripts/check_eval_card.py \
               genai-eval/examples/rag-grounding/eval-card.json > /tmp/out.txt; then
            echo "Gate 5 did not fire on a tampered split" >&2
            exit 1
          fi
          grep -q "Gate 5" /tmp/out.txt
          cp /tmp/test.jsonl.bak genai-eval/examples/rag-grounding/items/test.jsonl
